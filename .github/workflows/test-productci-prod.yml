name: Product API Production CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_FILE: compose.ci.yaml
      COMPOSE_PROJECT_NAME: product-api-prod-ci
      API_BASE_URL: http://127.0.0.1:13000

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js for HTTP tests
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Create CI environment
        run: |
          cat > .env.ci <<'EOF'
          NODE_ENV=production
          HOST=0.0.0.0
          PORT=3000
          MONGO_URI=mongodb://mongodb:27017/product_api_ci
          HEALTHCHECK_TIMEOUT_MS=2000
          EOF

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build production image and wait for healthy services
        run: docker compose up --build --wait --wait-timeout 180

      - name: Test deployed CRUD API and MongoDB persistence
        run: node --test --test-reporter=tap test/product-api.prod.test.js

      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200

      - name: Remove CI containers and test volume
        if: always()
        run: docker compose down --volumes --remove-orphans
