# Separate CI stack; build the same Dockerfile used for deployment.
services:
  mongodb:
    image: mongo:8.0
    volumes:
      - ci_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.runCommand({ ping: 1 }).ok === 1 ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.ci
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  ci_mongodb_data:
