name: Product API CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok === 1 ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s

    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: '3000'
      MONGO_URI: mongodb://127.0.0.1:27017/product_api_ci
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/product_api_ci
      HEALTHCHECK_TIMEOUT_MS: '2000'

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Product API tests
        run: npm test
